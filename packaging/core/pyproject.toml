[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "trajectory-operator-evolution"
version = "0.1.0"
description = "Domain-independent trajectory-informed search-operator evolution core"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "summerwind0131"}]
dependencies = [
  "numpy>=1.26,<3",
  "pandas>=2.1,<3",
  "pydantic>=2.7,<3",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

sealing:
  status: sealed_unrun
  seal_marker: data/benchmarks/uav2d-hidden-test-v2/SEALED.json
  preregistration_receipt: data/benchmarks/uav2d-hidden-test-v2/preregistration.json
  seal_receipt: data/benchmarks/uav2d-hidden-test-v2/seal_receipt.json
  seed_schedule: data/benchmarks/uav2d-hidden-test-v2/seed_schedule.csv
  forbidden_results_directory: artifacts/planning_benchmarks/uav2d-hidden-test-v2-final
  api_calls_required: 0

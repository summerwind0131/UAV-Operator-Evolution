  stochastic_baseline_records: 4200
  frozen_afl_records: 600
  evolutionary_v1_records: 600
  evolutionary_v2_records: 600
  total_records: 6360
  unique_record_key: [planner, arm_id, map_id, seed]

hypotheses:
  primary:
    - id: H1
      comparison: evolutionary_afl_uav_v2_vs_evolutionary_afl_uav_v1
      claim: higher_trusted_feasibility_or_equal_feasibility_and_lower_cost
      unit: map_id
      stochastic_aggregation: median_over_five_shared_seeds
  secondary:
    - id: H2
      comparison: evolutionary_afl_uav_v2_vs_frozen_afl_uav
      claim: higher_or_equal_feasibility_then_lower_cost
    - id: H3
      comparison: evolutionary_afl_uav_v2_vs_astar
      claim: higher_or_equal_feasibility_then_lower_cost
    - id: H4
      comparison: evolutionary_afl_uav_v2_vs_theta_star
      claim: higher_or_equal_feasibility_then_lower_cost
  exploratory:
    - id: E1
      comparison: evolutionary_afl_uav_v2_vs_evolutionary_afl_uav_v1
      subset: rooms_maze
      claim: descriptive_only

analysis:
  feasibility_metric: trusted_feasible_runs_divided_by_all_preregistered_runs
  map_success_metric: maps_with_at_least_one_trusted_feasible_path
  cost_summary: median_and_iqr_over_trusted_feasible_paths
  paired_summary: per_map_lexicographic_feasibility_then_median_cost
  diversity_metrics:
    - unique_final_path_hashes_per_map_over_five_seeds
    - within_map_cost_iqr
  resource_metrics:
    - elapsed_seconds
    - objective_evaluations
    - collision_checks
    - node_expansions
  uncertainty:
    method: cluster_bootstrap_over_map_id
    replicates: 10000
    confidence_level: 0.95
    seed: 2026081802
  tie_tolerance: 1.0e-9
  exact_test: two_sided_paired_sign_test_excluding_ties
  secondary_multiple_comparison_correction: holm_over_H2_H3_H4
  rooms_maze_status: exploratory_only
  paper_method_selection:
    first: higher_trusted_feasible_rate
    second_if_equal: lower_median_trusted_feasible_cost
    exact_tie: retain_v1
  exclusions: none_after_execution_except_cryptographically_proven_corrupt_records
  missing_records: protocol_failure_never_silently_drop
  post_result_parameter_or_metric_changes_allowed: false

